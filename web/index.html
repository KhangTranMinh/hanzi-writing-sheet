<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <title>Hanzi Learning</title>
  <link rel="stylesheet" href="assets/styles.css?v=26.11.13.05">
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <div class="eyebrow">HANZI LEARNING</div>
      <h1>Cùng luyện chữ Hán</h1>
      <p>Chọn một cách học để bắt đầu.</p>
    </header>
    <nav class="home-options" aria-label="Chọn hoạt động">
      <a class="home-option" href="worksheet/">
        <span class="option-icon" aria-hidden="true">✎</span>
        <span><strong>Tạo trang luyện viết</strong><small>Tạo trang tập viết chữ Hán hoặc trang ô trống để in.</small></span>
        <span class="option-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="home-option" href="lessons/?v=26.11.13.05">
        <span class="option-icon" aria-hidden="true">学</span>
        <span><strong>Bài học</strong><small>Chọn bài học và xem chữ Hán, pinyin cùng nghĩa.</small></span>
        <span class="option-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="home-option" href="practice/?v=26.11.13.05">
        <span class="option-icon" aria-hidden="true">字</span>
        <span><strong>Luyện tập</strong><small>Ôn chữ Hán và pinyin với các thẻ ghi nhớ.</small></span>
        <span class="option-arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <footer class="app-version" id="app-version">Phiên bản: đang tải…</footer>
  </main>
  <script>
    fetch('version.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Không tải được phiên bản');
        return response.json();
      })
      .then(data => {
        if (typeof data.version !== 'string' || !/^\d{2}\.\d{2}\.\d{2}\.\d{2,}$/.test(data.version)) throw new Error('Phiên bản không hợp lệ');
        document.querySelector('#app-version').textContent = `Phiên bản: ${data.version}`;
      })
      .catch(() => { document.querySelector('#app-version').textContent = 'Phiên bản: không xác định'; });
  </script>
</body>
</html>
